name: ci
on:
  pull_request:
  push:
    branches: [sandbox]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: tsc --noEmit (src)
        run: npx tsc --noEmit
      - name: tsc --noEmit (src + test)
        # The tests mount `client.requireAuth` on a REAL express app. Until this step
        # existed, tsconfig's `include: ["src"]` meant nothing typechecked that the
        # package's Express-shaped types are assignable to express's own RequestHandler --
        # vitest transpiles without typechecking, so the suite could pass on types that
        # would fail in every adopter.
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: no framework import in the core
        # The whole point of the structural types is that dist/index.d.ts names no
        # framework. Nothing else here defends that: re-adding `import type { Request }
        # from 'express'` leaves BOTH typechecks at rc=0 and all 49 tests passing, and
        # if the import is unused TypeScript even elides it from the emitted .d.ts -- so
        # the coupling returns silently on whichever later edit first uses the type.
        run: |
          if grep -rn "from 'express'" src/ | grep -v '^\s*\*' | grep -v '\*'; then
            echo "::error::src/ imports from 'express'. The core's types are structural on purpose -- see the comment at the top of src/index.ts."
            exit 1
          fi
      - name: conformance suite
        run: npx vitest run
