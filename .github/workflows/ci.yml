name: ci
on:
  pull_request:
  push:
    branches: [sandbox]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: conformance suite
        run: npx vitest run
